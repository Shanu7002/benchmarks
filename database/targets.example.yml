# Copy to targets.yml (git-ignored). DSNs support ${ENV_VAR} expansion so
# secrets stay in your environment, not in the file.
targets:
  pg-remote:
    dialect: postgres
    dsn: ${PG_DSN}        # postgres://user:pass@host:5432/db?sslmode=require
    label: "rds db.t4g.medium eu-west-1"
  mysql-remote:
    dialect: mysql
    dsn: ${MYSQL_DSN}     # user:pass@tcp(host:3306)/db
    label: "rds db.t4g.medium eu-west-1"

# Every scenario is capped by rows/operations, never by disk.
scenarios:
  bulk_insert:
    rows: 1000000
    batch_size: 1000
    concurrency: 4
    payload_bytes: 1024
  point_lookup:
    rows: 100000
    operations: 50000
    concurrency: 8
